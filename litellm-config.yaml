model_list:
  - model_name: "claude-*"
    litellm_params:
      model: "openai/qwen27b"
      api_base: "http://localhost:8000/v1"
      api_key: "dummy"
    model_info:
      max_tokens: 200000
      max_input_tokens: 190000
