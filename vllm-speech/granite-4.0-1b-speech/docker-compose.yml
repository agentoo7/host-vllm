services:
  qwen-hosting:
    image: vllm/vllm-openai:nightly
    container_name: granite-4.0-1b-speech
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "20013:6000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - "./data:/data"
    ipc: "host"
    shm_size: '64gb'
    command: >
      --model "ibm-granite/granite-4.0-1b-speech"
      --tensor-parallel-size 2
      --max-model-len 65536
      --gpu-memory-utilization 0.90
      --api-key speech-apikey
      --port 6000
    healthcheck:
      test: [ "CMD", "curl", "-H", "Authorization: Bearer lvm-apikey", "-f", "http://0.0.0.0:6000/v1/models" ]
      interval: 30s
      timeout: 5s
      retries: 20
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]