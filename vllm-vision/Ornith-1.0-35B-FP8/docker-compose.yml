services:
  ornith-hosting:
    image: vllm/vllm-openai:v0.25.1
    container_name: Ornith-1.0-35B-FP8
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    env_file:
      - ../../.env
    ports:
      - "20014:6000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - "./data:/data"
    ipc: "host"
    shm_size: '64gb'
    command: >
      --model "protoLabsAI/Ornith-1.0-35B-FP8"
      --served-model-name Ornith-1.0-35B
      --tensor-parallel-size 2
      --gpu-memory-utilization 0.88
      --max-model-len 204800
      --max-num-seqs 4
      --limit-mm-per-prompt '{"image": 8, "video": 1}'
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --trust-remote-code
      --disable-custom-all-reduce
      --port 6000
      --api-key lvm-apikey
    healthcheck:
      test: [ "CMD", "curl", "-H", "Authorization: Bearer lvm-apikey", "-f", "http://0.0.0.0:6000/v1/models" ]
      interval: 30s
      timeout: 5s
      retries: 40
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0', '1' ]
              capabilities: [ gpu ]
