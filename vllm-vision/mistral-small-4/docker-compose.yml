services:
  mistral-hosting:
    image: vllm/vllm-openai:v0.22.1
    container_name: Mistral-Small-4-119B-2603-NVFP4
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "20012:6000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - "./data:/data"
    ipc: "host"
    shm_size: '64gb'
    command: >
      --model "mistralai/Mistral-Small-4-119B-2603-NVFP4"
      --tokenizer-mode mistral
      --config-format mistral
      --load-format mistral
      --tensor-parallel-size 2
      --max-model-len 65536
      --gpu-memory-utilization 0.90
      --limit-mm-per-prompt '{"image": 4}'
      --tool-call-parser mistral
      --reasoning-parser mistral
      --allowed-local-media-path /data
      --port 6000
      --api-key lvm-apikey
    healthcheck:
      test: [ "CMD", "curl", "-H", "Authorization: Bearer lvm-apikey", "-f", "http://0.0.0.0:6000/v1/models" ]
      interval: 30s
      timeout: 5s
      retries: 40

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
